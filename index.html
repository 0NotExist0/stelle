<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stelle nel Cielo - Costellazioni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 Stelle nel Cielo</h1>
            <p>Punta la fotocamera al cielo per scoprire la costellazione</p>
        </header>

        <main>
            <section id="camera-section">
                <video id="camera-video" autoplay playsinline></video>
                <canvas id="overlay-canvas"></canvas>
                <div id="constellation-info" class="hidden">
                    <h2 id="constellation-name">--</h2>
                    <p id="constellation-description">--</p>
                </div>
            </section>

            <section id="controls">
                <button id="start-camera" class="btn">Avvia Fotocamera</button>
                <button id="capture-photo" class="btn hidden">Scatta Foto</button>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
