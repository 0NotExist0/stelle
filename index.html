<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Stellare - Cielo in Tempo Reale</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="sky-container">
        <canvas id="sky-canvas"></canvas>

        <!-- Mappa per selezione posizione (Google Maps, caricata dinamicamente) -->
        <div id="map-container" class="map-container hidden">
            <div id="map"></div>
            <div class="map-bar">
                <h3 id="map-title">Seleziona la tua posizione</h3>
                <div class="map-actions">
                    <button id="btn-use-gps" class="btn map-btn">📍 Usa GPS</button>
                    <button id="btn-confirm-map" class="btn map-btn">✓ Conferma</button>
                    <button id="btn-close-map" class="btn map-btn">✕ Chiudi</button>
                </div>
            </div>
        </div>

        <header class="sky-header">
            <h1>🌌 Mappa Stellare</h1>
            <div id="sky-status">Calcolo posizione...</div>
        </header>

        <div class="controls">
            <button id="btn-locate" class="btn">📍 La mia posizione</button>
            <button id="btn-map" class="btn">🗺 Mappa</button>
            <button id="btn-night" class="btn">🌙 Notturna</button>
            <button id="btn-constellations" class="btn active">✨ Costellazioni</button>
            <button id="btn-now" class="btn">⏱ Ora attuale</button>
        </div>

        <div id="info-panel" class="info-panel hidden">
            <h2 id="info-name">--</h2>
            <p id="info-detail">--</p>
            <p id="info-pos">--</p>
        </div>

        <div id="compass" class="compass">N</div>

        <div class="time-bar">
            <label for="datetime">Data / Ora</label>
            <input type="datetime-local" id="datetime">
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
